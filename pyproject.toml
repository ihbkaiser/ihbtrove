[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ihb-trove"
version = "0.3.0"
description = "Deterministic structural repair extension for Hugging Face DataTrove"
requires-python = ">=3.11"
dependencies = [
    "datatrove>=0.10.1,<0.11",
    "rapidfuzz>=3.0",
    "langdetect>=1.0.9",
    "orjson>=3.0",
    "spacy>=3.8",
    "pyvi>=0.1.1",
    "tokenizers>=0.20",
    "nltk>=3.8",
    "regex>=2023.0",
]

[project.scripts]
ihb-trove = "ihb_trove.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ihb_trove*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
